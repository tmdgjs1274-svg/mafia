<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마피아 게임 - 플레이어</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border: 1px solid #ccc;
        }
        .role-card {
            background: #f8f9fa;
            border: 2px dashed #6c757d;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }
        .role-title {
            font-size: 20px;
            font-weight: bold;
            color: #d9534f;
        }
        .chat-box {
            border: 1px solid #ccc;
            height: 200px;
            overflow-y: scroll;
            padding: 10px;
            background: #fafafa;
            margin-bottom: 10px;
        }
        .chat-input-group {
            display: flex;
        }
        .chat-input-group input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
        }
        .chat-input-group button {
            padding: 8px 15px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        .action-area {
            margin-top: 15px;
            padding: 10px;
            background: #e9ecef;
        }
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 5px;
        }
        .btn-vote {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>마피아 게임</h2>

        <!-- 당신의 역할 -->
        <div class="role-card">
            당신의 역할: <span class="role-title" id="my-role">마피아</span>
        </div>

        <!-- 게임 상태 -->
        <div style="margin-bottom: 10px; font-weight: bold;">
            현재 단계: <span id="current-phase">낮 (투표 시간)</span>
        </div>

        <!-- 채팅창 -->
        <div class="chat-box" id="chat">
            <div><b>[알림]:</b> 게임이 시작되었습니다.</div>
            <div><b>플레이어1:</b> 누가 마피아인가요?</div>
            <div><b>플레이어2:</b> 저는 시민입니다!</div>
        </div>
        <div class="chat-input-group">
            <input type="text" id="msg-input" placeholder="메시지를 입력하세요...">
            <button onclick="sendMessage()">전송</button>
        </div>

        <!-- 액션/투표 영역 -->
        <div class="action-area">
            <label for="target-select"><b>대상 선택 (투표 / 능력 사용):</b></label>
            <select id="target-select">
                <option value="">-- 대상 선택 --</option>
                <option value="플레이어1">플레이어 1</option>
                <option value="플레이어2">플레이어 2</option>
                <option value="플레이어3">플레이어 3</option>
            </select>
            <button class="btn-vote" onclick="submitAction()">선택 완료</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('msg-input');
            if (input.value.trim() !== '') {
                const chat = document.getElementById('chat');
                chat.innerHTML += `<div><b>나:</b> ${input.value}</div>`;
                chat.scrollTop = chat.scrollHeight;
                input.value = '';
            }
        }

        function submitAction() {
            const select = document.getElementById('target-select');
            if (select.value) {
                alert(`[${select.value}] 님을 선택했습니다.`);
            } else {
                alert('대상을 선택해 주세요.');
            }
        }
    </script>
</body>
</html>
