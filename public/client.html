<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마피아 게임 - 참가자</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
        }
        .status-box {
            background: #e9ecef;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .status-box .phase {
            font-size: 20px;
            font-weight: bold;
            color: #007bff;
        }
        .role-box {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .my-role {
            font-size: 18px;
            font-weight: bold;
            color: #dc3545;
        }
        .player-list {
            list-style: none;
            padding: 0;
        }
        .player-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
        }
        .player-item.dead {
            background-color: #ffe6e6;
            color: #888;
            text-decoration: line-through;
        }
        .logs {
            background: #333;
            color: #fff;
            padding: 10px;
            height: 120px;
            overflow-y: scroll;
            font-family: monospace;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>마피아 게임</h1>

        <div class="status-box">
            현재 상태: <span class="phase" id="game-phase">대기 중</span>
        </div>

        <div class="role-box">
            내 직업: <span class="my-role" id="my-role">게임 시작 전</span>
        </div>

        <h2>참여자 현황</h2>
        <ul class="player-list" id="players">
            <li class="player-item" id="player-1">
                <span>플레이어 1</span>
                <span class="status">생존</span>
            </li>
            <li class="player-item" id="player-2">
                <span>플레이어 2</span>
                <span class="status">생존</span>
            </li>
        </ul>

        <h2>게임 기록</h2>
        <div class="logs" id="log-box">
            [시스템] 방에 입장했습니다.<br>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // 게임 단계 변경 수신 (낮/밤)
        socket.on('phaseChange', (data) => {
            document.getElementById('game-phase').innerText = data.phase;
            appendLog(`[알림] ${data.phase}(이)가 되었습니다.`);
        });

        // 역할 부여 수신
        socket.on('assignRole', (data) => {
            document.getElementById('my-role').innerText = data.role;
            appendLog(`[시스템] 당신의 직업은 [${data.role}] 입니다.`);
        });

        // 플레이어 사망/처형 처리
        socket.on('playerDied', (data) => {
            const playerEl = document.getElementById(data.playerId);
            if (playerEl) {
                playerEl.classList.add('dead');
                playerEl.querySelector('.status').innerText = '사망';
            }
        });

        // 공통 로그 처리
        socket.on('log', (msg) => {
            appendLog(msg);
        });

        function appendLog(msg) {
            const logBox = document.getElementById('log-box');
            logBox.innerHTML += `${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }
    </script>
</body>
</html>
