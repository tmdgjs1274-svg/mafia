<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마피아 모바일 클라이언트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-2xl space-y-4">
    
    <!-- 타이틀 영역 -->
    <div class="text-center pb-2 border-b border-zinc-800">
      <h1 class="text-xl font-bold">마피아 모바일 클라이언트</h1>
      <p id="player-nickname-disp" class="text-xs text-zinc-400 mt-0.5">닉네임을 입력하고 접속하세요</p>
    </div>

    <!-- 로그인 폼 -->
    <div id="join-panel" class="space-y-3">
      <div>
        <label class="text-xs text-zinc-400 block mb-1">초대 코드</label>
        <input id="invite-code-input" type="text" uppercase placeholder="코드 4자리" class="w-full p-2.5 bg-zinc-950 border border-zinc-800 rounded-lg text-sm text-center font-bold text-emerald-400 tracking-widest uppercase focus:outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="text-xs text-zinc-400 block mb-1">닉네임</label>
        <input id="nickname-input" type="text" placeholder="닉네임 입력" class="w-full p-2.5 bg-zinc-950 border border-zinc-800 rounded-lg text-sm text-center focus:outline-none focus:border-emerald-500">
      </div>
      <button onclick="joinGame()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-lg text-sm transition">게임 입장</button>
    </div>

    <!-- 대기실 화면 -->
    <div id="waiting-panel" class="hidden text-center space-y-3 py-6">
      <div class="animate-pulse text-3xl">⏳</div>
      <p id="waiting-msg" class="text-sm font-semibold text-zinc-300">호스트가 게임을 시작하길 기다리고 있습니다...</p>
    </div>

    <!-- 게임 플레이 화면 -->
    <div id="game-panel" class="hidden space-y-4">
      
      <!-- 내 역할 카드 -->
      <div class="p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-center space-y-1">
        <span class="text-[10px] text-zinc-500 uppercase tracking-wider block">Your Role</span>
        <div id="role-title" class="text-lg font-bold text-emerald-400">시민</div>
        <div id="role-desc" class="text-xs text-zinc-400">특별한 능력은 없지만 투표권을 행사합니다.</div>
      </div>

      <!-- 상태 안내 메시지 -->
      <div id="phase-status-box" class="p-3 bg-zinc-950/50 border border-zinc-800/80 rounded-xl text-center">
        <div id="phase-title" class="text-xs font-bold text-amber-400">☀️ 낮 토론 시간</div>
        <p id="phase-msg" class="text-xs text-zinc-300 mt-1">자유롭게 토론을 나누세요.</p>
      </div>

      <!-- 마피아 액션 패널 -->
      <div id="mafia-action-panel" class="hidden space-y-3 bg-zinc-900 p-3.5 rounded-xl border border-red-900/40">
        <div class="text-xs font-bold text-red-400 flex items-center gap-1">
          🔴 마피아 밤 작전
        </div>

        <div id="mafia-partners-status" class="space-y-1.5 text-xs bg-zinc-950 p-2.5 rounded-lg border border-zinc-800">
        </div>

        <div>
          <label class="text-[11px] text-zinc-400 block mb-1">처형할 대상 지목</label>
          <select id="mafia-target-select" onchange="onMafiaTargetChange()" class="w-full p-2 bg-zinc-950 border border-zinc-800 rounded-lg text-xs text-white">
            <option value="">대상을 선택하세요</option>
          </select>
        </div>

        <div>
          <label class="text-[11px] text-zinc-400 block mb-1">의견 전달 (퀵 리액션)</label>
          <div class="grid grid-cols-3 gap-1.5">
            <button id="react-like" onclick="sendMafiaReaction('LIKE')" disabled class="py-1.5 bg-zinc-800 hover:bg-zinc-700 disabled:opacity-40 disabled:cursor-not-allowed text-xs rounded-lg transition font-medium">
              👍 좋아
            </button>
            <button id="react-letgo" onclick="sendMafiaReaction('LET_GO')" disabled class="py-1.5 bg-zinc-800 hover:bg-zinc-700 disabled:opacity-40 disabled:cursor-not-allowed text-xs rounded-lg transition font-medium">
              🎯 얘로 하자!
            </button>
            <button id="react-nope" onclick="sendMafiaReaction('NOPE')" disabled class="py-1.5 bg-zinc-800 hover:bg-zinc-700 disabled:opacity-40 disabled:cursor-not-allowed text-xs rounded-lg transition font-medium">
              🤔 아닌 거 같아
            </button>
          </div>
        </div>

        <button id="mafia-confirm-btn" onclick="confirmMafiaVote()" disabled class="w-full py-2.5 bg-red-600 hover:bg-red-500 disabled:bg-zinc-800 disabled:text-zinc-500 disabled:cursor-not-allowed text-xs font-bold rounded-lg transition">
          투표 확정
        </button>
      </div>

      <!-- 의사 액션 패널 -->
      <div id="doctor-action-panel" class="hidden space-y-2 bg-zinc-900 p-3.5 rounded-xl border border-emerald-900/40">
        <div class="text-xs font-bold text-emerald-400">🟢 의사 능력 사용</div>
        <select id="doctor-target-select" class="w-full p-2 bg-zinc-950 border border-zinc-800 rounded-lg text-xs text-white">
          <option value="">치료할 대상 선택</option>
        </select>
        <button id="doctor-confirm-btn" onclick="confirmDoctorAction()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold rounded-lg transition">
          치료 대상 확정
        </button>
      </div>

      <!-- 경찰 액션 패널 -->
      <div id="police-action-panel" class="hidden space-y-2 bg-zinc-900 p-3.5 rounded-xl border border-blue-900/40">
        <div class="text-xs font-bold text-blue-400">🔵 경찰 능력 사용</div>
        <select id="police-target-select" class="w-full p-2 bg-zinc-950 border border-zinc-800 rounded-lg text-xs text-white">
          <option value="">조사할 대상 선택</option>
        </select>
        <button id="police-confirm-btn" onclick="confirmPoliceAction()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-xs font-bold rounded-lg transition">
          신원 조사 실행
        </button>
        <div id="police-result-msg" class="text-xs font-bold text-amber-300 text-center pt-1 hidden"></div>
      </div>

      <!-- 영매 액션 패널 -->
      <div id="medium-action-panel" class="hidden space-y-2 bg-zinc-900 p-3.5 rounded-xl border border-purple-900/40">
        <div class="text-xs font-bold text-purple-400">🟣 영매 능력 사용</div>
        <select id="medium-target-select" class="w-full p-2 bg-zinc-950 border border-zinc-800 rounded-lg text-xs text-white">
          <option value="">사망자 선택</option>
        </select>
        <button id="medium-confirm-btn" onclick="confirmMediumAction()" class="w-full py-2.5 bg-purple-600 hover:bg-purple-500 text-xs font-bold rounded-lg transition">
          영혼 대화 실행
        </button>
        <div id="medium-result-msg" class="text-xs font-bold text-amber-300 text-center pt-1 hidden"></div>
      </div>

    </div>

  </div>

  <script>
    const socket = io();
    let myRole = null;
    let isAlive = true;
    let allPlayers = [];
    let currentMafiaReaction = null;
    let isMafiaConfirmed = false;
    let isMafiaUnanimous = false;

    // 조사 결과를 기록하기 위한 개인 저장소 객체 (ID: 결과문구)
    let policeHistory = {};
    let mediumHistory = {};

    const roleDetails = {
      mafia: { title: '🔴 마피아', desc: '밤마다 은밀히 시민을 처형합니다.' },
      police: { title: '🔵 경찰', desc: '밤마다 대상의 마피아 여부를 조사합니다.' },
      doctor: { title: '🟢 의사', desc: '밤마다 마피아 공격으로부터 사람을 치료합니다.' },
      medium: { title: '🟣 영매', desc: '밤마다 죽은 자의 성불 전 정체를 밝힙니다.' },
      citizen: { title: '⚪ 시민', desc: '추리와 투표로 마피아를 찾아냅니다.' }
    };

    const reactionBadgeMap = {
      'LIKE': '<span class="px-1.5 py-0.5 bg-blue-500/20 text-blue-400 border border-blue-500/30 rounded text-[10px]">👍 좋아</span>',
      'LET_GO': '<span class="px-1.5 py-0.5 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded text-[10px]">🎯 얘로 하자!</span>',
      'NOPE': '<span class="px-1.5 py-0.5 bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded text-[10px]">🤔 아닌 거 같아</span>'
    };

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const codeParam = urlParams.get('code');
      if (codeParam) {
        document.getElementById('invite-code-input').value = codeParam.toUpperCase();
      }
    };

    function joinGame() {
      const code = document.getElementById('invite-code-input').value.trim().toUpperCase();
      const nickname = document.getElementById('nickname-input').value.trim();

      if (!code || !nickname) return alert('초대코드와 닉네임을 모두 입력하세요.');

      document.getElementById('player-nickname-disp').innerText = nickname;
      socket.emit('join_game', { nickname, code });
    }

    socket.on('join_error', (msg) => {
      alert(msg);
      document.getElementById('join-panel').classList.remove('hidden');
      document.getElementById('waiting-panel').classList.add('hidden');
    });

    socket.on('rejoin_waiting', (msg) => {
      document.getElementById('join-panel').classList.add('hidden');
      document.getElementById('waiting-panel').classList.remove('hidden');
      document.getElementById('waiting-msg').innerText = msg;
    });

    socket.on('join_success', () => {
      document.getElementById('join-panel').classList.add('hidden');
      document.getElementById('waiting-panel').classList.remove('hidden');
    });

    socket.on('rejoin_success', ({ role, isAlive: alive, currentPhase, mafiaPartners }) => {
      myRole = role;
      isAlive = alive;

      document.getElementById('join-panel').classList.add('hidden');
      document.getElementById('waiting-panel').classList.add('hidden');
      document.getElementById('game-panel').classList.remove('hidden');

      updateRoleUI(role);
      
      if (!isAlive) {
        setDeadState();
      }
    });

    socket.on('your_role', ({ role, isAlive: alive }) => {
      myRole = role;
      isAlive = alive;

      document.getElementById('waiting-panel').classList.add('hidden');
      document.getElementById('game-panel').classList.remove('hidden');

      updateRoleUI(role);
    });

    function updateRoleUI(role) {
      const info = roleDetails[role] || roleDetails.citizen;
      document.getElementById('role-title').innerText = info.title;
      document.getElementById('role-desc').innerText = info.desc;
    }

    function setDeadState() {
      document.getElementById('phase-title').innerText = "💀 당신은 사망했습니다";
      document.getElementById('phase-msg').innerText = "더 이상 게임에 참여할 수 없지만 관전 가능합니다.";
      hideAllActionPanels();
    }

    socket.on('update_players', ({ players }) => {
      allPlayers = players;
    });

    socket.on('phase_change', ({ phase, msg, resultMsg }) => {
      hideAllActionPanels();

      if (!isAlive) {
        setDeadState();
        return;
      }

      const pTitle = document.getElementById('phase-title');
      const pMsg = document.getElementById('phase-msg');

      if (phase === 'DAY') {
        pTitle.innerText = "☀️ 낮 토론 단계";
        pTitle.className = "text-xs font-bold text-amber-400";
        pMsg.innerText = resultMsg || msg || "자유롭게 의견을 펼치세요.";
      }
    });

    socket.on('night_started', ({ players }) => {
      allPlayers = players;
      if (!isAlive) return;

      const pTitle = document.getElementById('phase-title');
      const pMsg = document.getElementById('phase-msg');
      pTitle.innerText = "🌙 밤 단계";
      pTitle.className = "text-xs font-bold text-indigo-400";
      pMsg.innerText = "능력을 보유한 경우 아래의 행동을 진행하세요.";

      hideAllActionPanels();

      if (myRole === 'mafia') {
        setupMafiaPanel();
      } else if (myRole === 'doctor') {
        setupDoctorPanel();
      } else if (myRole === 'police') {
        setupPolicePanel();
      } else if (myRole === 'medium') {
        setupMediumPanel();
      }
    });

    function hideAllActionPanels() {
      document.getElementById('mafia-action-panel').classList.add('hidden');
      document.getElementById('doctor-action-panel').classList.add('hidden');
      document.getElementById('police-action-panel').classList.add('hidden');
      document.getElementById('medium-action-panel').classList.add('hidden');
    }

    // --- 마피아 로직 ---
    function setupMafiaPanel() {
      const panel = document.getElementById('mafia-action-panel');
      panel.classList.remove('hidden');

      const select = document.getElementById('mafia-target-select');
      const aliveList = allPlayers.filter(p => p.isAlive);
      
      select.innerHTML = '<option value="">대상을 선택하세요</option>' + 
        aliveList.map(p => `<option value="${p.id}">${p.nickname}</option>`).join('');

      currentMafiaReaction = null;
      isMafiaConfirmed = false;
      isMafiaUnanimous = false;

      document.getElementById('react-like').disabled = true;
      document.getElementById('react-letgo').disabled = true;
      document.getElementById('react-nope').disabled = true;
      
      const confirmBtn = document.getElementById('mafia-confirm-btn');
      confirmBtn.disabled = true;
      confirmBtn.innerText = "투표 확정";

      document.getElementById('mafia-partners-status').innerHTML = '';
    }

    function onMafiaTargetChange() {
      const targetId = document.getElementById('mafia-target-select').value;
      const hasTarget = !!targetId;

      document.getElementById('react-like').disabled = !hasTarget;
      document.getElementById('react-letgo').disabled = !hasTarget;
      document.getElementById('react-nope').disabled = !hasTarget;
      
      isMafiaConfirmed = false;
      currentMafiaReaction = null;

      socket.emit('mafia_vote', { targetId, confirmed: false, reaction: null });
    }

    function sendMafiaReaction(type) {
      const targetId = document.getElementById('mafia-target-select').value;
      if (!targetId) return;

      currentMafiaReaction = type;
      socket.emit('mafia_vote', { targetId, confirmed: isMafiaConfirmed, reaction: type });
    }

    function confirmMafiaVote() {
      const targetId = document.getElementById('mafia-target-select').value;
      
      if (!targetId || !isMafiaUnanimous) return;

      isMafiaConfirmed = true;
      socket.emit('mafia_vote', { targetId, confirmed: true, reaction: currentMafiaReaction });
      
      const confirmBtn = document.getElementById('mafia-confirm-btn');
      confirmBtn.innerText = "확정 완료!";
      confirmBtn.disabled = true;
    }

    socket.on('mafia_vote_update', ({ statusData, isUnanimous }) => {
      const container = document.getElementById('mafia-partners-status');
      if (!container) return;

      isMafiaUnanimous = isUnanimous;

      container.innerHTML = Object.keys(statusData).map(nick => {
        const info = statusData[nick];
        const statusBadge = info.confirmed 
          ? '<span class="text-emerald-400 font-bold">[확정]</span>' 
          : '<span class="text-amber-500 font-bold">[선택중]</span>';
        
        const reactBadge = info.reaction ? reactionBadgeMap[info.reaction] || '' : '';

        const targetBadge = info.targetId 
          ? `<span class="px-1.5 py-0.5 bg-blue-500/20 text-blue-400 border border-blue-500/30 rounded text-[11px] font-bold">${info.targetName}</span>`
          : `<span class="text-zinc-500 font-medium">${info.targetName}</span>`;

        return `
          <div class="flex justify-between items-center py-0.5">
            <span class="text-zinc-300 font-medium">${nick}</span>
            <div class="flex items-center gap-1.5">
              ${reactBadge}
              ${targetBadge}
              ${statusBadge}
            </div>
          </div>
        `;
      }).join('');

      const confirmBtn = document.getElementById('mafia-confirm-btn');
      if (isMafiaConfirmed) {
        confirmBtn.disabled = true;
        confirmBtn.innerText = "확정 완료!";
      } else {
        if (isMafiaUnanimous) {
          confirmBtn.disabled = false;
          confirmBtn.innerText = "투표 확정";
        } else {
          confirmBtn.disabled = true;
          confirmBtn.innerText = "의견 불일치 (확정 불가)";
        }
      }
    });

    // --- 의사 로직 ---
    function setupDoctorPanel() {
      const panel = document.getElementById('doctor-action-panel');
      panel.classList.remove('hidden');

      const select = document.getElementById('doctor-target-select');
      const aliveList = allPlayers.filter(p => p.isAlive);
      select.innerHTML = '<option value="">치료할 대상 선택</option>' + 
        aliveList.map(p => `<option value="${p.id}">${p.nickname}</option>`).join('');

      const btn = document.getElementById('doctor-confirm-btn');
      btn.disabled = false;
      btn.innerText = "치료 대상 확정";
    }

    function confirmDoctorAction() {
      const targetId = document.getElementById('doctor-target-select').value;
      if (!targetId) return alert('치료할 사람을 선택하세요.');

      socket.emit('doctor_action', { targetId, confirmed: true });
      const btn = document.getElementById('doctor-confirm-btn');
      btn.innerText = "치료 완료!";
      btn.disabled = true;
    }

    // --- 경찰 로직 ---
    function setupPolicePanel() {
      const panel = document.getElementById('police-action-panel');
      panel.classList.remove('hidden');

      const select = document.getElementById('police-target-select');
      const aliveList = allPlayers.filter(p => p.isAlive && p.id !== socket.id);

      select.innerHTML = '<option value="">조사할 대상 선택</option>' + 
        aliveList.map(p => {
          const historyTag = policeHistory[p.id] ? ` (${policeHistory[p.id]})` : '';
          return `<option value="${p.id}">${p.nickname}${historyTag}</option>`;
        }).join('');

      const btn = document.getElementById('police-confirm-btn');
      btn.disabled = false;
      btn.innerText = "신원 조사 실행";
      document.getElementById('police-result-msg').classList.add('hidden');
    }

    function confirmPoliceAction() {
      const targetId = document.getElementById('police-target-select').value;
      if (!targetId) return alert('조사할 대상 선택하세요.');

      socket.emit('police_investigate', { targetId });
      const btn = document.getElementById('police-confirm-btn');
      btn.innerText = "조사 완료!";
      btn.disabled = true;
    }

    socket.on('police_result', ({ targetId, targetName, isMafia }) => {
      const resBox = document.getElementById('police-result-msg');
      resBox.classList.remove('hidden');
      
      const tag = isMafia ? '조사완료: 마피아' : '조사완료: 시민';
      policeHistory[targetId] = tag;

      resBox.innerHTML = isMafia 
        ? `<span class="text-red-500">[결과] ${targetName}님은 🔴 마피아입니다!</span>`
        : `<span class="text-emerald-400">[결과] ${targetName}님은 마피아가 아닙니다.</span>`;
    });

    // --- 영매 로직 ---
    function setupMediumPanel() {
      const panel = document.getElementById('medium-action-panel');
      panel.classList.remove('hidden');

      const select = document.getElementById('medium-target-select');
      const confirmBtn = document.getElementById('medium-confirm-btn');
      const resBox = document.getElementById('medium-result-msg');
      const deadList = allPlayers.filter(p => !p.isAlive);

      if (deadList.length === 0) {
        select.classList.add('hidden');
        confirmBtn.classList.add('hidden');
        resBox.classList.remove('hidden');
        resBox.innerHTML = `<span class="text-zinc-400">사망한 플레이어가 없어 능력을 사용할 수 없습니다.</span>`;
      } else {
        select.classList.remove('hidden');
        confirmBtn.classList.remove('hidden');
        resBox.classList.add('hidden');
        
        select.innerHTML = '<option value="">사망자 선택</option>' + 
          deadList.map(p => {
            const historyTag = mediumHistory[p.id] ? ` (${mediumHistory[p.id]})` : '';
            return `<option value="${p.id}">${p.nickname}${historyTag}</option>`;
          }).join('');
        confirmBtn.disabled = false;
        confirmBtn.innerText = "영혼 대화 실행";
      }
    }

    function confirmMediumAction() {
      const targetId = document.getElementById('medium-target-select').value;
      if (!targetId) return alert('사망자를 선택하세요.');

      socket.emit('medium_investigate', { targetId });
      const btn = document.getElementById('medium-confirm-btn');
      btn.innerText = "성불 완료!";
      btn.disabled = true;
    }

    socket.on('medium_result', ({ targetId, targetName, role }) => {
      const resBox = document.getElementById('medium-result-msg');
      resBox.classList.remove('hidden');

      mediumHistory[targetId] = `성불완료: ${role}`;

      resBox.innerHTML = `<span class="text-purple-300">[결과] ${targetName}님의 직업은 <b>${role}</b>였습니다.</span>`;
    });

    socket.on('player_died', () => {
      isAlive = false;
      setDeadState();
    });

    socket.on('game_over', ({ winner }) => {
      const pTitle = document.getElementById('phase-title');
      const pMsg = document.getElementById('phase-msg');
      hideAllActionPanels();

      if (winner === 'CITIZEN') {
        pTitle.innerText = "🎉 시민 승리!";
        pTitle.className = "text-base font-extrabold text-emerald-400";
        pMsg.innerText = "마피아를 모두 소탕했습니다.";
      } else {
        pTitle.innerText = "🔴 마피아 승리!";
        pTitle.className = "text-base font-extrabold text-red-500";
        pMsg.innerText = "마피아가 도심을 점령했습니다.";
      }
    });

    socket.on('roles_reset', () => {
      myRole = null;
      isAlive = true;
      policeHistory = {};
      mediumHistory = {};
      document.getElementById('game-panel').classList.add('hidden');
      document.getElementById('waiting-panel').classList.remove('hidden');
      document.getElementById('waiting-msg').innerText = "게임이 초기화되었습니다. 호스트를 기다려주세요.";
    });
  </script>
</body>
</html>
