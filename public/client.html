<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마피아 게임 - 참가자</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md space-y-6">
        <h1 class="text-xl font-bold text-center border-b pb-3">마피아 게임</h1>

        <!-- 입장 영역 -->
        <div id="join-box" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">닉네임</label>
                <input type="text" id="nickname" class="w-full border rounded p-2 text-sm" placeholder="닉네임을 입력하세요">
            </div>
            <button onclick="joinGame()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded">입장하기</button>
        </div>

        <!-- 게임 진행 영역 -->
        <div id="game-box" class="hidden space-y-4">
            <div class="bg-gray-50 p-3 rounded text-center font-semibold">
                단계: <span id="phase-text" class="text-blue-600">대기 중</span> 
                (<span id="day-text">1</span>일차)
            </div>

            <div class="bg-yellow-50 border border-yellow-200 text-yellow-800 p-4 rounded text-center">
                <div class="text-xs">내 직업</div>
                <div id="my-role" class="text-xl font-bold mt-1">대기 중</div>
            </div>

            <div>
                <h3 class="font-bold text-sm mb-2">플레이어 현황</h3>
                <ul id="player-list" class="divide-y border rounded text-sm"></ul>
            </div>

            <div>
                <h3 class="font-bold text-sm mb-1">게임 로그</h3>
                <div id="log-box" class="w-full h-32 bg-gray-900 text-green-400 p-2 rounded font-mono text-xs overflow-y-auto whitespace-pre-wrap"></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myName = '';

        function joinGame() {
            const nickname = document.getElementById('nickname').value.trim();
            if (!nickname) return alert('닉네임을 입력하세요.');
            
            myName = nickname;
            socket.emit('joinGame', { nickname });
        }

        socket.on('joinResponse', (res) => {
            if (res.success) {
                document.getElementById('join-box').classList.add('hidden');
                document.getElementById('game-box').classList.remove('hidden');
            } else {
                alert(res.message);
            }
        });

        socket.on('roleAssigned', (data) => {
            document.getElementById('my-role').innerText = data.role;
        });

        socket.on('roomUpdate', (state) => {
            document.getElementById('phase-text').innerText = state.phase === 'day' ? '낮' : (state.phase === 'night' ? '밤' : '대기 중');
            document.getElementById('day-text').innerText = state.dayCount;

            const listEl = document.getElementById('player-list');
            listEl.innerHTML = Object.values(state.players).map(p => `
                <li class="p-2 flex justify-between items-center ${p.isAlive ? '' : 'bg-red-50 text-red-400 line-through'}">
                    <span>${p.nickname} ${p.nickname === myName ? '(나)' : ''}</span>
                    <span class="text-xs">${p.isAlive ? '생존' : '사망'}</span>
                </li>
            `).join('');
        });

        socket.on('systemLog', (msg) => {
            const logBox = document.getElementById('log-box');
            logBox.innerText += msg + '\n';
            logBox.scrollTop = logBox.scrollHeight;
        });
    </script>
</body>
</html>
