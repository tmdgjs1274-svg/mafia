<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마피아 게임 - Host 관제탑</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md space-y-6">
        <div class="flex justify-between items-center border-b pb-4">
            <h1 class="text-2xl font-bold text-gray-900">마피아 게임 호스트 (Host)</h1>
            <div class="text-sm bg-blue-100 text-blue-800 font-bold px-3 py-1 rounded">
                초대 코드: <span id="room-code">MAFIA1</span>
            </div>
        </div>

        <!-- 게임 상태 바 -->
        <div class="grid grid-cols-3 gap-4 bg-gray-50 p-4 rounded-md text-center font-semibold">
            <div>단계: <span id="phase-text" class="text-blue-600">대기 중</span></div>
            <div>일차: <span id="day-text">1</span>일차</div>
            <div>참가자: <span id="player-count">0</span>명</div>
        </div>

        <!-- 플레이어 목록 및 처형 제어 -->
        <div>
            <h2 class="text-lg font-bold mb-3">참가자 현황 및 즉시 처형</h2>
            <div class="overflow-x-auto">
                <table class="w-full border-collapse border border-gray-200 text-sm text-center">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="border p-2">닉네임</th>
                            <th class="border p-2">직업</th>
                            <th class="border p-2">상태</th>
                            <th class="border p-2">처형 제어</th>
                        </tr>
                    </thead>
                    <tbody id="player-table">
                        <tr><td colspan="4" class="p-4 text-gray-500">참가자가 없습니다.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 게임 제어 버튼 -->
        <div class="flex space-x-3">
            <button onclick="startGame()" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded">게임 시작</button>
            <button onclick="changePhase()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded">다음 단계 (낮/밤)</button>
            <button onclick="resetGame()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded">리셋</button>
        </div>

        <!-- 시스템 로그 -->
        <div>
            <h2 class="text-lg font-bold mb-2">실시간 로그</h2>
            <div id="log-box" class="w-full h-40 bg-gray-900 text-green-400 p-3 rounded font-mono text-xs overflow-y-auto whitespace-pre-wrap"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoomState = null;

        socket.emit('initHost');

        socket.on('roomUpdate', (state) => {
            currentRoomState = state;
            document.getElementById('phase-text').innerText = state.phase === 'day' ? '낮' : (state.phase === 'night' ? '밤' : '대기 중');
            document.getElementById('day-text').innerText = state.dayCount;
            
            renderPlayers(state.players, state.phase, state.executedThisDay);
        });

        function renderPlayers(players, phase, executedThisDay) {
            const list = Object.values(players);
            document.getElementById('player-count').innerText = list.length;
            const tbody = document.getElementById('player-table');

            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-gray-500">참가자가 없습니다.</td></tr>';
                return;
            }

            // 낮이 아니거나 이미 낮에 처형을 1회 진행했다면 처형 버튼 비활성화 (disabled)
            const isKillDisabled = (phase !== 'day') || executedThisDay;

            tbody.innerHTML = list.map(p => `
                <tr class="${p.isAlive ? '' : 'bg-red-50 text-red-400 line-through'}">
                    <td class="border p-2 font-semibold">${p.nickname}</td>
                    <td class="border p-2">${p.role || '-'}</td>
                    <td class="border p-2">${p.isAlive ? '생존' : '사망'}</td>
                    <td class="border p-2">
                        <button onclick="executePlayer('${p.id}')" 
                            class="bg-red-600 hover:bg-red-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-bold px-3 py-1 rounded text-xs"
                            ${(!p.isAlive || isKillDisabled) ? 'disabled' : ''}>
                            처형
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function executePlayer(id) {
            socket.emit('executePlayer', id);
        }

        function startGame() {
            // 기본 밸런스 셋팅 (마피아 1, 경찰 1, 의사 1)
            socket.emit('startGame', ['마피아', '경찰', '의사']);
        }

        function changePhase() { socket.emit('changePhase'); }
        function resetGame() { socket.emit('resetGame'); }

        socket.on('systemLog', (msg) => {
            const logBox = document.getElementById('log-box');
            logBox.innerText += msg + '\n';
            logBox.scrollTop = logBox.scrollHeight;
        });
    </script>
</body>
</html>
