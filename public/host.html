<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>마피아 게임 - 호스트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-6 space-y-5">
    <h1 class="text-xl font-bold border-b border-zinc-800 pb-4">마피아 게임 호스트</h1>
    <button onclick="startGame()" class="w-full py-3.5 bg-blue-600 font-bold rounded-xl">역할 분배 및 시작</button>
  </div>
  <script>
    const socket = io();
    function startGame() { socket.emit('start_game', {}); alert('게임을 시작합니다!'); }
  </script>
</body>
</html>
