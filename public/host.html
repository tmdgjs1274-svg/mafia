<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마피아 게임 - 호스트 화면</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
        }
        .status-box {
            background: #e9ecef;
            padding: 15px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .player-list {
            list-style: none;
            padding: 0;
        }
        .player-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .player-item.dead {
            background-color: #ffe6e6;
            color: #888;
            text-decoration: line-through;
        }
        .controls {
            margin-top: 20px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            margin-right: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button.danger {
            background-color: #dc3545;
        }
        button.danger:hover {
            background-color: #bd2130;
        }
        .logs {
            background: #333;
            color: #fff;
            padding: 10px;
            height: 15px;
            overflow-y: scroll;
            font-family: monospace;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>마피아 게임 관리자 (Host)</h1>
        
        <div class="status-box">
            현재 상태: <span id="game-phase">대기 중</span> | 남은 시간: <span id="timer">--</span>초
        </div>

        <h2>참여자 목록 (<span id="player-count">0</span>명)</h2>
        <ul class="player-list" id="players">
            <!-- 플레이어 예시 -->
            <li class="player-item">
                <span>플레이어 1 (시민)</span>
                <div>
                    <button onclick="killPlayer('플레이어 1')">처형/사망</button>
                </div>
            </li>
            <li class="player-item dead">
                <span>플레이어 2 (마피아) - 사망</span>
                <div>
                    <span>사망함</span>
                </div>
            </li>
        </ul>

        <div class="controls">
            <h2>게임 진행 제어</h2>
            <button onclick="startGame()">게임 시작</button>
            <button onclick="nextPhase()">다음 단계로 진행</button>
            <button class="danger" onclick="resetGame()">게임 리셋</button>
        </div>

        <h2>게임 진행 기록</h2>
        <div class="logs" id="log-box">
            [시스템] 호스트가 방을 생성했습니다.<br>
            [시스템] 플레이어 1 님이 입장했습니다.<br>
            [시스템] 플레이어 2 님이 입장했습니다.<br>
        </div>
    </div>

    <script>
        function startGame() {
            alert("게임을 시작합니다.");
        }
        function nextPhase() {
            alert("다음 단계로 넘어갑니다.");
        }
        function resetGame() {
            alert("게임을 초기화합니다.");
        }
        function killPlayer(name) {
            alert(name + " 님을 사망 처리했습니다.");
        }
    </script>
</body>
</html>
