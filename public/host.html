<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마피아 호스트 화면</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen p-4 flex items-center justify-center relative">

  <!-- 우상단 전체화면 버튼 -->
  <button onclick="toggleFullScreen()" class="absolute top-4 right-4 px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold rounded-lg text-xs flex items-center gap-1 shadow-lg transition z-10">
    🖥️ 전체화면
  </button>

  <div class="w-full max-w-4xl bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl grid grid-cols-1 md:grid-cols-12 gap-6">
    
    <!-- LEFT PANEL -->
    <div class="md:col-span-4 space-y-4 border-r border-zinc-800/80 pr-0 md:pr-4">
      <div>
        <span class="text-xs text-emerald-400 font-bold uppercase tracking-wider">Host Dashboard</span>
        <h1 class="text-2xl font-bold">마피아 게임 보드</h1>
      </div>

      <div class="p-3 bg-zinc-950 border border-zinc-800 rounded-xl flex items-center justify-between">
        <div>
          <div class="text-[10px] text-zinc-500 font-semibold">참가 초대 코드</div>
          <div id="invite-code" class="text-xl font-black tracking-widest text-emerald-400">----</div>
        </div>
        <div onclick="openQrModal()" class="cursor-pointer bg-white p-1 rounded-lg">
          <img id="qr-thumb" src="" alt="QR Code" class="w-10 h-10">
        </div>
      </div>

      <div>
        <div class="flex justify-between text-xs mb-2">
          <span class="text-zinc-400 font-medium">플레이어 상태</span>
          <span class="text-zinc-400"><b id="player-count" class="text-emerald-400">0</b> 명</span>
        </div>
        <div id="player-list" class="space-y-1.5 overflow-y-auto max-h-64 border border-zinc-800/80 rounded-xl p-2 bg-zinc-950/50 text-xs"></div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="md:col-span-8 flex flex-col justify-between space-y-4">
      
      <!-- 역할 세팅 -->
      <div id="setup-panel" class="space-y-4">
        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
          <span class="text-xs text-zinc-400 font-semibold">역할 세팅 (총 <span id="total-roles" class="text-white font-bold">8</span>개)</span>
          <button onclick="applyDefaultPreset()" class="text-[11px] text-blue-400 underline">8인 추천 세팅</button>
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <div class="flex justify-between items-center p-2 bg-zinc-950 rounded-lg border border-zinc-800">
            <span class="text-red-400 font-semibold">🔴 마피아</span>
            <div class="flex items-center gap-1.5">
              <button onclick="changeRole('mafia', -1)" class="w-5 h-5 bg-zinc-800 rounded font-bold">-</button>
              <span id="role-mafia" class="w-3 text-center font-bold">2</span>
              <button onclick="changeRole('mafia', 1)" class="w-5 h-5 bg-zinc-800 rounded font-bold">+</button>
            </div>
          </div>
          <div class="flex justify-between items-center p-2 bg-zinc-950 rounded-lg border border-zinc-800">
            <span class="text-blue-400 font-semibold">🔵 경찰</span>
            <div class="flex items-center gap-1.5">
              <button onclick="changeRole('police', -1)" class="w-5 h-5 bg-zinc-800 rounded font-bold">-</button>
              <span id="role-police" class="w-3 text-center font-bold">1</span>
              <button onclick="changeRole('police', 1)" class="w-5 h-5 bg-zinc-800 rounded font-bold">+</button>
            </div>
          </div>
          <div class="flex justify-between items-center p-2 bg-zinc-950 rounded-lg border border-zinc-800">
            <span class="text-emerald-400 font-semibold">🟢 의사</span>
            <div class="flex items-center gap-1.5">
              <button onclick="changeRole('doctor', -1)" class="w-5 h-5 bg-zinc-800 rounded font-bold">-</button>
              <span id="role-doctor" class="w-3 text-center font-bold">1</span>
              <button onclick="changeRole('doctor', 1)" class="w-5 h-5 bg-zinc-800 rounded font-bold">+</button>
            </div>
          </div>
          <div class="flex justify-between items-center p-2 bg-zinc-950 rounded-lg border border-zinc-800">
            <span class="text-purple-400 font-semibold">🟣 영매</span>
            <div class="flex items-center gap-1.5">
              <button onclick="changeRole('medium', -1)" class="w-5 h-5 bg-zinc-800 rounded font-bold">-</button>
              <span id="role-medium" class="w-3 text-center font-bold">1</span>
              <button onclick="changeRole('medium', 1)" class="w-5 h-5 bg-zinc-800 rounded font-bold">+</button>
            </div>
          </div>
          <div class="flex justify-between items-center p-2 bg-zinc-950 rounded-lg border border-zinc-800 col-span-2">
            <span class="text-zinc-300 font-semibold">⚪ 시민</span>
            <div class="flex items-center gap-1.5">
              <button onclick="changeRole('citizen', -1)" class="w-5 h-5 bg-zinc-800 rounded font-bold">-</button>
              <span id="role-citizen" class="w-3 text-center font-bold">3</span>
              <button onclick="changeRole('citizen', 1)" class="w-5 h-5 bg-zinc-800 rounded font-bold">+</button>
            </div>
          </div>
        </div>

        <button id="assign-btn" onclick="startGame()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl text-sm transition">역할 부여 및 게임 시작</button>
      </div>

      <!-- 진행 보드 -->
      <div id="game-panel" class="hidden space-y-4 flex-1 flex flex-col justify-between">
        <div class="p-4 bg-zinc-950 border border-zinc-800 rounded-xl space-y-2 text-center">
          <span id="phase-badge" class="px-3 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-md text-xs font-bold">낮 토론 단계</span>
          <div id="announcement-text" class="text-base font-bold text-zinc-100 mt-2">
            자유롭게 토론을 진행한 후 투표를 진행해주세요.
          </div>
        </div>

        <!-- 실시간 능력 확정 현황 표시판 (밤 전용) -->
        <div id="night-status-card" class="hidden bg-indigo-950/40 p-3 rounded-xl border border-indigo-800/60 space-y-2">
          <div class="text-xs font-bold text-indigo-300">🌙 밤 능력 실시간 완료 현황</div>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div id="st-mafia" class="p-2 bg-zinc-950 rounded border border-zinc-800 flex justify-between">
              <span>🔴 마피아</span> <span id="st-mafia-val">⏳ 대기중</span>
            </div>
            <div id="st-doctor" class="p-2 bg-zinc-950 rounded border border-zinc-800 flex justify-between">
              <span>🟢 의사</span> <span id="st-doctor-val">⏳ 대기중</span>
            </div>
            <div id="st-police" class="p-2 bg-zinc-950 rounded border border-zinc-800 flex justify-between">
              <span>🔵 경찰</span> <span id="st-police-val">⏳ 대기중</span>
            </div>
            <div id="st-medium" class="p-2 bg-zinc-950 rounded border border-zinc-800 flex justify-between">
              <span>🟣 영매</span> <span id="st-medium-val">⏳ 대기중</span>
            </div>
          </div>
        </div>

        <!-- 낮 투표 제어 -->
        <div id="day-controls" class="space-y-3 bg-zinc-950/40 p-3 rounded-xl border border-zinc-800/50">
          <label class="text-xs text-zinc-400 block font-semibold">낮 투표 처형 대상 선택</label>
          <div class="flex gap-2">
            <select id="vote-target" class="flex-1 p-2 bg-zinc-950 border border-zinc-800 rounded-lg text-xs">
            </select>
            <button onclick="executePlayer()" class="px-4 py-2 bg-red-600 hover:bg-red-500 rounded-lg text-xs font-bold">처형</button>
          </div>
        </div>

        <!-- 버튼 제어 -->
        <div class="flex gap-2 border-t border-zinc-800 pt-3">
          <button id="night-btn" onclick="goNight()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-sm transition">🌙 밤으로 진행</button>
          <button id="day-btn" onclick="goDay()" class="hidden flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl text-sm transition">☀️ 밤 결과 발표 & 낮 진행</button>
          <button onclick="resetGame()" class="px-4 py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-400 font-bold rounded-xl text-xs">게임 리셋</button>
        </div>
      </div>

    </div>

  </div>

  <!-- QR 모달 -->
  <div id="qr-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50" onclick="closeQrModal()">
    <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl text-center space-y-4 max-w-xs w-full" onclick="event.stopPropagation()">
      <h3 class="text-base font-bold text-white">참가용 QR 코드</h3>
      <div class="bg-white p-3 rounded-xl inline-block">
        <img id="qr-large" src="" alt="QR Code" class="w-48 h-48 mx-auto">
      </div>
      <button onclick="closeQrModal()" class="w-full py-2 bg-zinc-800 font-bold rounded-lg text-xs">닫기</button>
    </div>
  </div>

  <script>
    const socket = io();
    let playersData = [];
    let roles = { mafia: 2, police: 1, doctor: 1, medium: 1, citizen: 3 };
    let currentNightStatus = {}; // 밤 확정 상태 저장

    socket.on('init_state', ({ inviteCode }) => {
      document.getElementById('invite-code').innerText = inviteCode;
      const playUrl = `${window.location.origin}/play?code=${inviteCode}`;
      const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(playUrl)}`;
      document.getElementById('qr-thumb').src = qrApi;
      document.getElementById('qr-large').src = qrApi;
    });

    socket.on('update_players', ({ players }) => {
      playersData = players;
      document.getElementById('player-count').innerText = players.length;
      document.getElementById('player-list').innerHTML = players.map(p => `
        <div class="flex justify-between items-center p-2 bg-zinc-900 rounded-lg border border-zinc-800">
          <span class="font-medium ${p.isAlive ? 'text-white' : 'text-zinc-600 line-through'}">${p.nickname}</span>
          <span class="text-[10px] font-semibold ${p.isAlive ? 'text-emerald-400' : 'text-red-500'}">
            ${p.isAlive ? '생존' : '사망'}
          </span>
        </div>
      `).join('');

      updateVoteDropdown();
      updateTotal();
      checkWinCondition();
    });

    socket.on('night_status_update', (st) => {
      currentNightStatus = st;
      document.getElementById('st-mafia-val').innerText = !st.hasMafia ? '없음' : (st.mafiaConfirmed ? '✅ 완료' : '⏳ 진행중');
      document.getElementById('st-doctor-val').innerText = !st.hasDoctor ? '없음' : (st.doctorConfirmed ? '✅ 완료' : '⏳ 진행중');
      document.getElementById('st-police-val').innerText = !st.hasPolice ? '없음' : (st.policeConfirmed ? '✅ 완료' : '⏳ 진행중');
      document.getElementById('st-medium-val').innerText = !st.hasMedium ? '없음' : (st.mediumConfirmed ? '✅ 완료' : '⏳ 진행중');
    });

    socket.on('phase_change', ({ phase, msg, resultMsg }) => {
      const badge = document.getElementById('phase-badge');
      const text = document.getElementById('announcement-text');
      const nightCard = document.getElementById('night-status-card');

      if (phase === 'NIGHT') {
        badge.innerText = "🌙 밤 단계";
        badge.className = "px-3 py-1 bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded-md text-xs font-bold";
        text.innerText = msg;
        nightCard.classList.remove('hidden');
        document.getElementById('night-btn').classList.add('hidden');
        document.getElementById('day-btn').classList.remove('hidden');
        document.getElementById('day-controls').classList.add('hidden');
      } else {
        badge.innerText = "☀️ 낮 단계";
        badge.className = "px-3 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-md text-xs font-bold";
        text.innerText = resultMsg || msg || "자유로운 토론을 시작하세요.";
        nightCard.classList.add('hidden');
        document.getElementById('night-btn').classList.remove('hidden');
        document.getElementById('day-btn').classList.add('hidden');
        document.getElementById('day-controls').classList.remove('hidden');
      }
    });

    function updateVoteDropdown() {
      const select = document.getElementById('vote-target');
      if (!select) return;
      const alive = playersData.filter(p => p.isAlive);
      select.innerHTML = '<option value="">처형 대상 선택</option>' + alive.map(p => `<option value="${p.id}">${p.nickname}</option>`).join('');
    }

    function changeRole(role, delta) {
      if (roles[role] + delta < 0) return;
      roles[role] += delta;
      document.getElementById(`role-${role}`).innerText = roles[role];
      updateTotal();
    }

    function applyDefaultPreset() {
      Object.assign(roles, { mafia: 2, police: 1, doctor: 1, medium: 1, citizen: 3 });
      for (const key in roles) document.getElementById(`role-${key}`).innerText = roles[key];
      updateTotal();
    }

    function updateTotal() {
      const total = Object.values(roles).reduce((a, b) => a + b, 0);
      document.getElementById('total-roles').innerText = total;
      const assignBtn = document.getElementById('assign-btn');
      if (total !== playersData.length) {
        assignBtn.disabled = true;
        assignBtn.className = "w-full py-3.5 bg-zinc-800 text-zinc-500 font-bold rounded-xl cursor-not-allowed text-xs";
        assignBtn.innerText = `인원 불일치 (선택: ${total}명 / 접속: ${playersData.length}명)`;
      } else {
        assignBtn.disabled = false;
        assignBtn.className = "w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition text-sm cursor-pointer";
        assignBtn.innerText = "역할 부여 및 게임 시작";
      }
    }

    function startGame() {
      socket.emit('assign_roles', roles);
      document.getElementById('setup-panel').classList.add('hidden');
      document.getElementById('game-panel').classList.remove('hidden');
    }

    function goNight() { socket.emit('start_night'); }

    // 밤 결과 진행 시 미확정자 체크
    function goDay() { 
      const st = currentNightStatus;
      const isAllConfirmed = 
        (!st.hasMafia || st.mafiaConfirmed) &&
        (!st.hasDoctor || st.doctorConfirmed) &&
        (!st.hasPolice || st.policeConfirmed) &&
        (!st.hasMedium || st.mediumConfirmed);

      if (!isAllConfirmed) {
        if (!confirm('아직 능력을 확정하지 않은 직업이 있습니다. 정말 진행하시겠습니까?')) {
          return;
        }
      }
      socket.emit('resolve_night'); 
    }

    function executePlayer() {
      const targetId = document.getElementById('vote-target').value;
      if (!targetId) return alert('처형할 플레이어를 선택하세요.');
      const p = playersData.find(item => item.id === targetId);
      if (confirm(`${p.nickname}님을 처형하시겠습니까?`)) {
        socket.emit('kill_player', targetId);
      }
    }

    function checkWinCondition() {
      if (playersData.length === 0) return;
      const alive = playersData.filter(p => p.isAlive && p.role);
      if (alive.length === 0) return;

      const mafias = alive.filter(p => p.role === 'mafia').length;
      const citizens = alive.length - mafias;

      if (mafias === 0) {
        document.getElementById('announcement-text').innerHTML = "<span class='text-emerald-400 font-extrabold text-2xl'>🎉 시민 팀 승리! 🎉</span>";
      } else if (mafias >= citizens) {
        document.getElementById('announcement-text').innerHTML = "<span class='text-red-500 font-extrabold text-2xl'>🔴 마피아 팀 승리! 🔴</span>";
      }
    }

    function resetGame() {
      socket.emit('reset_roles');
      document.getElementById('setup-panel').classList.remove('hidden');
      document.getElementById('game-panel').classList.add('hidden');
    }

    function openQrModal() { document.getElementById('qr-modal').classList.remove('hidden'); }
    function closeQrModal() { document.getElementById('qr-modal').classList.add('hidden'); }

    // 전체 화면 전환 함수
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          alert(`전체화면 모드를 켤 수 없습니다: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
